name: Publish TypeVoice for Linux

on:
  push:
    tags:
      - 'typevoice-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example typevoice-v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify release tag and source version
        run: |
          version=$(/usr/bin/python3 -c 'from typevoice import __version__; print(__version__)')
          test "$RELEASE_TAG" = "typevoice-v$version"
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo python3-cairo python3-numpy \
            python3-cryptography python3-xlib gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 alsa-utils pulseaudio-utils \
            xdg-utils xvfb xauth dbus-x11 desktop-file-utils fonts-noto-cjk

      - name: Test logic and desktop integration
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/python3 tests/test_port.py
          /usr/bin/python3 -m unittest discover -s tests -p 'test_migration.py' -v
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_regressions.py' -v
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_history_window.py' -v
          TYPEVOICE_HOTKEY_TEST=1 xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_hotkey.py' -v
          desktop-file-validate packaging/typevoice.desktop

      - name: Build and verify package
        run: |
          /usr/bin/python3 scripts/build_deb.py
          dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/test_deb.py "dist/typevoice_${VERSION}-1_all.deb"

      - name: Render interface preview
        env:
          PYTHONPATH: .
        run: xvfb-run -a /usr/bin/python3 scripts/preview_ui.py

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "TypeVoice $VERSION · Linux" \
              --notes-file packaging/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" \
            "dist/typevoice_${VERSION}-1_all.deb" \
            "dist/typevoice_${VERSION}-1_all.deb.sha256" \
            dist/ui-preview.png dist/history-preview.png --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "TypeVoice $VERSION · Linux" \
            --notes-file packaging/RELEASE_NOTES.md

      - name: Remove superseded branding release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view suiyan-v0.1.0 > /dev/null 2>&1; then
            gh release delete suiyan-v0.1.0 --yes --cleanup-tag
          fi
